buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
    }
}

apply plugin: 'com.android.application'

android {
    namespace 'com.djjoafficial.djtubeplus'
    compileSdk 34
    defaultConfig {
        applicationId 'com.djjoafficial.djtubeplus'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

// Esto silencia la advertencia del SDK 34 y deja pasar la compilación de una
ext.supressUnsupportedCompileSdk = 34
